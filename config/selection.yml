# 선정 단계(evaluate.py) 설정. 영문은 단어 단위로, 국문은 부분 문자열로 비교한다 (keywords.yml과 같은 방식)

# Gemini에 보내기 전에 빼는 기사: 제목에 이 단어가 있으면 뺀다.
# 선정 프롬프트의 추출 기준(행사 안내, 인사, 수상, 주가, 홍보)을 옮긴 것이다.
# 단어를 더할 때는 다른 뜻으로도 쓰이는지 확인한다 (예: "수상"은 "수상한", "부스"는 "부스터"에 걸려서 넣지 않음).
# 바꾼 뒤에는 tools/check_prefilter.py로 지난 로그에서 선정된 기사가 빠지지 않는지 확인한다.
exclude_title:
  행사:
    - "세미나"
    - "웨비나"
    - "webinar"
    - "컨퍼런스 개최"
    - "포럼 개최"
    - "행사 개최"
    - "참가자 모집"
    - "사전 등록"
    - "사전등록"
    - "해커톤"
    - "박람회"
    - "전시회"
  인사:
    - "취임"
    - "선임"
    - "임명"
    - "승진"
    - "영입"
  수상:
    - "시상식"
    - "어워드"
    - "표창"
    - "award"
  주가:
    - "주가"
    - "목표가"
    - "시가총액"
    - "공모가"
    - "증시"
    - "코스닥"
    - "코스피"
  홍보:
    - "할인"
    - "프로모션"
    - "출시 기념"
    - "체험단"
    - "증정"
    - "쿠폰"
    - "MOU"
    - "업무협약"
    - "협약 체결"
    - "맞손"

# 후보가 PREFILTER_MAX보다 많을 때 남길 순서. 기사 주제(keywords.yml의 topics) 가중치 중 가장 큰 값이 큰 기사부터,
# 같으면 최근 기사부터 남긴다. 여기 없는 주제는 0. 합으로 정렬하면 태그가 여러 개인 기사가 늘 앞서서 태그가 하나인
# 기사가 채점도 받지 못하고 빠졌다 (10-28 104건)
topic_weights:
  에이전트: 3
  보안: 3
  개발: 2
  모델: 3
  신기술: 3
  규제: 1
  산업: 0
  일반: 0

# 합계에 들어가는 항목의 가중치 (impact, relevance 둘 다 있고 합 1).
# Gemini가 준 점수(파급력 1~10, 관련성 1~5)를 각각 0~100으로 바꿔 가중합한다.
criteria_weights:
  impact: 0.6
  relevance: 0.4

# 요약 자리(목록 위쪽 TOP_N건)의 분야 상한. 분야는 Gemini가 기사마다 하나 고른 대표 분야(AI 모델, AI 에이전트, 보안, 신기술, 기타).
# 한 분야(기타 포함)는 max건까지. 파급력이 exempt_impact 이상(업계 전체가 대응할 일)인 기사는 넘어도 들어가고 분야 건수에 셈.
# 합계가 min_total 미만인 기사는 상한 때문에 끌어올리지 않고, 자리가 남으면 상한 없이 합계 순으로 채운다. 이 항목을 지우면 상한 없음
# 면제는 같은 사안에서 한 번이고, 지난 리포트에 실린 사안의 후속에는 주지 않는다.
# floor_total: 요약 자리에 네 분야(기타 제외)마다 1건씩 먼저 넣는다. 그 분야 최고 기사가 이 점수 이상일 때만
#   (60으로 하면 여러 소식을 모은 기사가 들어온 날이 있어 66.7. 10-24 "AI 모델 신작 8종" 63.3)
# list_max, list_min_total: 목록 전체(LIST_N건)에서 한 분야는 list_max건까지. 합계가 list_min_total 이상인 구간에만
#   적용하고, 그 아래에서는 상한에 걸린 기사도 합계 순으로 다시 본다. 12로 하면 70점 보안 기사(실제 악용 패치)가
#   63점 다른 분야 기사에 밀린 날이 있어 15 (10-28)
field_cap:
  max: 3
  exempt_impact: 9
  min_total: 60
  floor_total: 66.7
  list_max: 15
  list_min_total: 63

# 같은 사안(같은 사건과 그 후속 보도, 대응, 다른 제품 영향을 묶은 것. 선정 응답의 story_of, story_prev)의 상한.
# 후속 보도는 같은 사건이 아니라서 한 사안이 하루 목록 4~5건을 차지했다 (10-22 ~ 10-24 PHP2Shell)
story_cap:
  summary: 1
  list: 2

# 합계에서 빼는 점수 {단계: 감점}. 새로움, 근거는 상위권에서 순위를 거의 가르지 못해 합계에 넣지 않고 감점에만 쓴다.
# 1점(새 사실 없는 해설, 근거가 드러나지 않음)은 10점, 새로움 2점(이미 알려진 사안의 후속)은 5점.
# 지난 리포트에 실린 사안의 후속은 새로움이 3으로 와도 2로 본다.
penalties:
  novelty: {1: 10, 2: 5}
  certainty: {1: 10}
