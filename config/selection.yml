# 선정 단계(evaluate.py) 설정. 영문은 단어 단위로, 국문은 부분 문자열로 비교한다 (keywords.yml과 같은 방식)

# Gemini에 보내기 전에 빼는 기사: 제목에 이 단어가 있으면 뺀다.
# 선정 프롬프트의 추출 기준(행사 안내, 인사, 수상, 주가, 홍보)을 옮긴 것이다.
# 단어를 더할 때는 다른 뜻으로도 쓰이는지 확인한다 (예: "수상"은 "수상한", "부스"는 "부스터"에 걸려서 넣지 않음).
# 바꾼 뒤에는 tools/check_prefilter.rb로 지난 로그에서 선정된 기사가 빠지지 않는지 확인한다.
exclude_title:
  행사:
    - "세미나"
    - "웨비나"
    - "webinar"
    - "컨퍼런스 개최"
    - "포럼 개최"
    - "행사 개최"
    - "참가자 모집"
    - "사전 등록"
    - "사전등록"
    - "해커톤"
    - "박람회"
    - "전시회"
  인사:
    - "취임"
    - "선임"
    - "임명"
    - "승진"
    - "영입"
  수상:
    - "시상식"
    - "어워드"
    - "표창"
    - "award"
  주가:
    - "주가"
    - "목표가"
    - "시가총액"
    - "공모가"
    - "증시"
    - "코스닥"
    - "코스피"
  홍보:
    - "할인"
    - "프로모션"
    - "출시 기념"
    - "체험단"
    - "증정"
    - "쿠폰"
    - "MOU"
    - "업무협약"
    - "협약 체결"
    - "맞손"

# 후보가 PREFILTER_MAX보다 많을 때 남길 순서. 기사 주제(keywords.yml의 topics)의 가중치 합이 큰 기사부터,
# 같으면 최근 기사부터 남긴다. 여기 없는 주제는 0.
topic_weights:
  에이전트: 3
  보안: 3
  개발: 2
  모델: 2
  신기술: 1
  규제: 1
  산업: 0
  일반: 0

# 중요도 항목별 가중치 (합 1). Gemini가 항목마다 1~5점을 주면 각 점수를 0~100으로 바꿔 가중합한다.
criteria_weights:
  impact: 0.4
  practical: 0.3
  novelty: 0.2
  certainty: 0.1
