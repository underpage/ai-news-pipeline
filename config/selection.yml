# 선정 단계(evaluate.py) 설정. 영문은 단어 단위로, 국문은 부분 문자열로 비교한다 (keywords.yml과 같은 방식)

# Gemini에 보내기 전에 빼는 기사: 제목에 이 단어가 있으면 뺀다.
# 선정 프롬프트의 추출 기준(행사 안내, 인사, 수상, 주가, 홍보)을 옮긴 것이다.
# 단어를 더할 때는 다른 뜻으로도 쓰이는지 확인한다 (예: "수상"은 "수상한", "부스"는 "부스터"에 걸려서 넣지 않음).
# 바꾼 뒤에는 tools/check_prefilter.rb로 지난 로그에서 선정된 기사가 빠지지 않는지 확인한다.
exclude_title:
  행사:
    - "세미나"
    - "웨비나"
    - "webinar"
    - "컨퍼런스 개최"
    - "포럼 개최"
    - "행사 개최"
    - "참가자 모집"
    - "사전 등록"
    - "사전등록"
    - "해커톤"
    - "박람회"
    - "전시회"
  인사:
    - "취임"
    - "선임"
    - "임명"
    - "승진"
    - "영입"
  수상:
    - "시상식"
    - "어워드"
    - "표창"
    - "award"
  주가:
    - "주가"
    - "목표가"
    - "시가총액"
    - "공모가"
    - "증시"
    - "코스닥"
    - "코스피"
  홍보:
    - "할인"
    - "프로모션"
    - "출시 기념"
    - "체험단"
    - "증정"
    - "쿠폰"
    - "MOU"
    - "업무협약"
    - "협약 체결"
    - "맞손"

# 후보가 PREFILTER_MAX보다 많을 때 남길 순서. 기사 주제(keywords.yml의 topics)의 가중치 합이 큰 기사부터,
# 같으면 최근 기사부터 남긴다. 여기 없는 주제는 0.
topic_weights:
  에이전트: 3
  보안: 3
  개발: 2
  모델: 3
  신기술: 3
  규제: 1
  산업: 0
  일반: 0

# 합계에 들어가는 항목의 가중치 (impact, relevance 둘 다 있고 합 1).
# Gemini가 준 점수(파급력 1~10, 관련성 1~5)를 각각 0~100으로 바꿔 가중합한다.
criteria_weights:
  impact: 0.6
  relevance: 0.4

# 요약 자리(목록 위쪽 TOP_N건)의 분야 상한. 분야는 Gemini가 기사마다 하나 고른 대표 분야(AI 모델, AI 에이전트, 보안, 신기술, 기타).
# 한 분야(기타 포함)는 max건까지. 파급력이 exempt_impact 이상(업계 전체가 대응할 일)인 기사는 넘어도 들어가고 분야 건수에 셈.
# 합계가 min_total 미만인 기사는 상한 때문에 끌어올리지 않고, 자리가 남으면 상한 없이 합계 순으로 채운다. 이 항목을 지우면 상한 없음
field_cap:
  max: 3
  exempt_impact: 9
  min_total: 70

# 합계에서 빼는 점수. 새로움, 근거는 상위권에서 순위를 거의 가르지 못해 합계에 넣지 않고,
# 가장 낮은 단계(1점: 새 사실 없는 해설, 근거가 드러나지 않음)일 때만 이만큼 뺀다.
penalties:
  novelty: 10
  certainty: 10
